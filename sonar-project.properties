sonar.projectKey=Ashhh02_accreditation_management_system
sonar.projectName=accreditation_management_system
sonar.organization=new-organi

# Source locations to analyze
sonar.sources=config,core,accounts,accreditation,resources,intelligence,dashboard,static/js,static/css
sonar.tests=config,core,accounts,accreditation,resources,intelligence,dashboard
sonar.test.inclusions=**/*test*.py,**/tests.py

# Files and directories to exclude from analysis
sonar.exclusions=**/migrations/**,staticfiles/**,**/*.pyc,media/**,db.sqlite3,.venv/**,**/.coverage,coverage.xml

# Files analyzed under the .py, .html, .js, .css families
sonar.sourceEncoding=UTF-8

# Python coverage (Cobertura) produced by the CI pipeline
sonar.python.coverage.reportPaths=coverage.xml

# Web (Django templates) and general languages
sonar.html.file.suffixes=.html
sonar.javascript.file.suffixes=.js
sonar.css.file.suffixes=.css