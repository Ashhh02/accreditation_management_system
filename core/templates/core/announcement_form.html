{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'css/notifications.css' %}">
{% endblock %}

{% block content %}
  <div class="content-header">
    <div>
      <h1>{{ page_title }}</h1>
      <p class="content-meta">Sent to every approved user as a live announcement</p>
    </div>
  </div>

  <section class="announcement-form-card">
    <form method="post" class="stack-form">
      {% csrf_token %}
      <label for="id_title">Title</label>
      <input type="text" id="id_title" name="title" required maxlength="180" placeholder="Announcement title">

      <label for="id_body">Message</label>
      <textarea id="id_body" name="body" required rows="6" placeholder="Write the announcement message…"></textarea>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Post announcement</button>
        <a href="{% url 'core:announcements' %}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </section>
{% endblock %}
