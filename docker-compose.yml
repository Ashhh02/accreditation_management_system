services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ams}
      POSTGRES_USER: ${POSTGRES_USER:-ams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ams}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ams}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/${GITHUB_REPOSITORY:-accreditation-management-system}:${DEPLOY_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment: &web_env
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
      DEBUG: "False"
      DEMO_MODE: "False"
      DJANGO_ENABLE_HTTPS: "True"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_DB_ENGINE: django.db.backends.postgresql
      DJANGO_DB_NAME: ${POSTGRES_DB:-ams}
      DJANGO_DB_USER: ${POSTGRES_USER:-ams}
      DJANGO_DB_PASSWORD: ${POSTGRES_PASSWORD:-ams}
      DJANGO_DB_HOST: db
      DJANGO_DB_PORT: "5432"
      DJANGO_CACHE_BACKEND: django.core.cache.backends.redis.RedisCache
      DJANGO_CACHE_LOCATION: redis://redis:6379/1
      REDIS_URL: redis://redis:6379/1
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"

volumes:
  db_data: